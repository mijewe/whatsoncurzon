name: Refresh showtimes data

on:
  schedule:
    # Every 6 hours. Curzon publishes new days of schedule a few times a day.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      # Each site is scraped independently — one breaking (e.g. a site
      # redesign) shouldn't block the other's data from refreshing and
      # being committed. A failure here is still visible as a workflow
      # warning, just not fatal to the job.
      - run: npm run refresh || echo "::warning::Curzon refresh failed"
      - run: npm run refresh:thelight || echo "::warning::The Light refresh failed"

      - name: Commit updated data.json files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/thelight/data.json
          git diff --staged --quiet || git commit -m "Refresh showtimes data"
          git push
