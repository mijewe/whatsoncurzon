name: Refresh showtimes data

# The Light only. Curzon can't be scraped from GitHub's runners (Cloudflare
# blocks datacenter IPs outright), so docs/data.json is refreshed from a
# residential connection by scripts/local-refresh.sh — see the README.

on:
  schedule:
    # Every 6 hours.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # No headless browser needed for The Light. A failure fails the run, so a
      # broken scraper shows as red rather than a quiet warning.
      - run: npm run refresh:thelight

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/thelight/data.json
          git diff --staged --quiet || git commit -m "Refresh showtimes data"
          # The local Curzon refresh pushes to the same branch, so rebase over it.
          git pull --rebase
          git push
