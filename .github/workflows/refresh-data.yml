name: Refresh showtimes data

on:
  schedule:
    # Every 6 hours. Curzon publishes new days of schedule a few times a day.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      # Each site is scraped independently so one breaking (e.g. a site
      # redesign or a bot block) doesn't stop the other's data being committed.
      # continue-on-error lets the commit step run; the final step then fails
      # the job so a broken scraper shows as a red run, not a quiet warning.
      - id: curzon
        run: CURZON_HEADED=1 xvfb-run --auto-servernum npm run refresh
        continue-on-error: true
      - id: thelight
        run: npm run refresh:thelight
        continue-on-error: true

      - name: Commit updated data.json files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/thelight/data.json
          git diff --staged --quiet || git commit -m "Refresh showtimes data"
          git push

      - name: Fail if any scraper failed
        if: steps.curzon.outcome == 'failure' || steps.thelight.outcome == 'failure'
        run: |
          echo "curzon: ${{ steps.curzon.outcome }}, thelight: ${{ steps.thelight.outcome }}"
          exit 1
