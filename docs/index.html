<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curzon, but better</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c9184a">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e2;
    --accent: #c9184a;
    --accent-fg: #ffffff;
    --chip-bg: #f4f4f4;
    --chip-bg-sold-out: #f4f4f4;
    --card-bg: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --fg: #f0f0f0;
      --muted: #9a9a9a;
      --border: #333537;
      --accent: #ff5c8a;
      --accent-fg: #16181a;
      --chip-bg: #24262a;
      --chip-bg-sold-out: #24262a;
      --card-bg: #1d1f22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  header p.tagline {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 28px;
  }
  .field label {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  select, input[type="time"] {
    font-size: 1rem;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
  }
  .time-filter {
    display: flex;
    gap: 8px;
  }
  input[type="time"]:disabled {
    opacity: 0.5;
  }
  .date-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding: 2px;
    scrollbar-width: none;
  }
  .date-strip::-webkit-scrollbar {
    display: none;
  }
  .date-chip {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
    cursor: pointer;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .date-chip.active {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
  }
  .date-arrow {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
    cursor: pointer;
    font-size: 1.1rem;
  }
  .date-arrow:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .date-arrow:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .coming-soon {
    margin-bottom: 28px;
  }
  .coming-soon-details summary {
    cursor: pointer;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    padding: 4px 0;
  }
  .coming-soon-list {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .coming-soon-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .coming-soon-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .coming-soon-date {
    color: var(--muted);
    font-size: 0.75rem;
  }
  .cinema-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cinema-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    cursor: pointer;
    font-size: 0.85rem;
    user-select: none;
  }
  .cinema-toggle input { display: none; }
  .cinema-toggle.active {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
  }
  .status {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 20px 0;
  }
  .status.error { color: var(--accent); }
  section.film {
    margin-bottom: 40px;
  }
  section.film h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.3rem;
    border-bottom: 2px solid var(--fg);
    padding-bottom: 6px;
    margin-bottom: 4px;
  }
  section.film h2 .film-title {
    flex: 1;
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    background: none;
    border: none;
    padding: 2px;
    margin: 0;
    cursor: pointer;
    color: var(--muted);
  }
  .icon-btn:hover {
    color: var(--accent);
  }
  .icon-btn svg {
    width: 16px;
    height: 16px;
  }
  .film-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 8px;
    flex-wrap: wrap;
  }
  .film-meta-left {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .meta-separator {
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1;
    white-space: nowrap;
  }
  /* Official BBFC classification colours (from bbfc.co.uk's own icon fills). */
  .age-rating {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    line-height: 1.3;
    color: #fff;
    background: var(--muted);
    white-space: nowrap;
  }
  .age-rating[data-rating="U"] { background: #0ac700; }
  .age-rating[data-rating="PG"] { background: #fbad00; }
  .age-rating[data-rating="12"], .age-rating[data-rating="12A"] { background: #ff7d13; }
  .age-rating[data-rating="15"] { background: #fb4f93; }
  .age-rating[data-rating="18"] { background: #dc0a0a; }
  .leaving-soon-badge,
  .one-off-badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 700;
    line-height: 1.4;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
    margin: -2px 0 8px;
  }
  .leaving-soon-badge {
    color: #dc0a0a;
    background: color-mix(in srgb, #dc0a0a 12%, transparent);
  }
  .one-off-badge {
    color: #3b82f6;
    background: color-mix(in srgb, #3b82f6 12%, transparent);
  }
  .runtime {
    margin: 0;
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .rt-score {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
    text-decoration: none;
  }
  .rt-score:hover {
    color: var(--accent);
  }
  .curzon-link {
    flex-shrink: 0;
    display: inline-flex;
    color: var(--muted);
  }
  .curzon-link:hover {
    color: var(--accent);
  }
  .curzon-link svg {
    width: 16px;
    height: 16px;
  }
  section.film p.desc {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .cinema-group {
    margin-bottom: 16px;
  }
  .cinema-group h3 {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.95rem;
    margin: 0 0 6px;
  }
  .citymapper-link {
    display: inline-flex;
    color: var(--muted);
  }
  .citymapper-link:hover {
    color: var(--accent);
  }
  .citymapper-link svg {
    width: 14px;
    height: 14px;
  }
  .times {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .time-chip {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 6px;
    background: var(--chip-bg);
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
    text-decoration: none;
    color: var(--fg);
  }
  a.time-chip:hover {
    background: var(--accent);
    color: var(--accent-fg);
  }
  .time-chip.sold-out {
    background: var(--chip-bg-sold-out);
    color: var(--muted);
    text-decoration: line-through;
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }
  .hidden-section {
    margin-top: 24px;
  }
  .hidden-section summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 4px 0;
  }
  .hidden-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .hidden-list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .unhide-btn {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    gap: 4px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.8rem;
  }
  .unhide-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .unhide-btn svg {
    width: 14px;
    height: 14px;
  }
  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 0.75rem;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .github-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    color: var(--muted);
    text-decoration: none;
  }
  .github-link:hover {
    color: var(--accent);
  }
  .github-link svg {
    width: 16px;
    height: 16px;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Curzon, but better</h1>
    <p class="tagline">See what's on at your favourite Curzon cinemas</p>
  </header>

  <div class="coming-soon" id="coming-soon"></div>

  <div class="controls">
    <div class="field">
      <label>Date</label>
      <div class="date-nav">
        <button type="button" id="date-prev" class="date-arrow" aria-label="Previous day">‹</button>
        <div class="date-strip" id="date-strip"></div>
        <button type="button" id="date-next" class="date-arrow" aria-label="Next day">›</button>
      </div>
    </div>
    <div class="field">
      <label for="time-filter-mode">Show times</label>
      <div class="time-filter">
        <select id="time-filter-mode">
          <option value="any">Any time</option>
          <option value="after">After</option>
          <option value="before">Before</option>
        </select>
        <input type="time" id="time-filter-value">
      </div>
    </div>
    <div class="field">
      <label>Cinemas</label>
      <div class="cinema-picker" id="cinema-picker"></div>
    </div>
  </div>

  <div id="status" class="status"></div>
  <div id="results"></div>

  <footer>
    <p id="footer-text"></p>
    <a class="github-link" href="https://github.com/mijewe/whatsoncurzon" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 98 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"></path></svg>
      mijewe/whatsoncurzon
    </a>
  </footer>
</div>

<script>
const STORAGE_KEY = 'curzon-favourite-cinemas';

function loadFavourites() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function saveFavourites(ids) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(ids));
}

const HIDDEN_STORAGE_KEY = 'curzon-hidden-films';

function loadHiddenFilms() {
  try {
    const raw = localStorage.getItem(HIDDEN_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
}

function saveHiddenFilms(ids) {
  localStorage.setItem(HIDDEN_STORAGE_KEY, JSON.stringify(ids));
}

const TIME_FILTER_STORAGE_KEY = 'curzon-time-filter';

function loadTimeFilter() {
  try {
    const raw = localStorage.getItem(TIME_FILTER_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function saveTimeFilter(filter) {
  localStorage.setItem(TIME_FILTER_STORAGE_KEY, JSON.stringify(filter));
}

const COMING_SOON_OPEN_STORAGE_KEY = 'curzon-coming-soon-open';

function loadComingSoonOpen() {
  try {
    const raw = localStorage.getItem(COMING_SOON_OPEN_STORAGE_KEY);
    return raw === null ? true : raw === 'true';
  } catch {
    return true;
  }
}

function saveComingSoonOpen(open) {
  localStorage.setItem(COMING_SOON_OPEN_STORAGE_KEY, String(open));
}

function timeOfDayMinutes(iso) {
  const d = new Date(iso);
  return d.getHours() * 60 + d.getMinutes();
}

function matchesTimeFilter(iso, filter) {
  if (filter.mode === 'any' || !filter.time) return true;
  const [h, m] = filter.time.split(':').map(Number);
  const cutoff = h * 60 + m;
  const minutes = timeOfDayMinutes(iso);
  return filter.mode === 'after' ? minutes >= cutoff : minutes < cutoff;
}

function formatDateChipLabel(dateStr, todayStr) {
  if (dateStr === todayStr) return 'Today';
  const d = new Date(dateStr + 'T12:00:00Z');
  const weekday = d.toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'UTC' });
  const day = d.toLocaleDateString('en-GB', { day: 'numeric', timeZone: 'UTC' });
  return `${weekday} ${day}`;
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' }).replace(/^0/, '');
}

function formatTimeRange(startIso, endIso) {
  return `${formatTime(startIso)} → ${formatTime(endIso)}`;
}

function formatRuntime(minutes) {
  if (!minutes) return '';
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h === 0) return `${m}m`;
  if (m === 0) return `${h}h`;
  return `${h}h ${m}m`;
}

function bookingUrl(showtimeId) {
  return `https://www.curzon.com/ticketing/seats/${showtimeId}/`;
}

function filmUrl(filmId) {
  // The slug segment is cosmetic — curzon.com routes on the film ID alone.
  return `https://www.curzon.com/films/film/${filmId}/`;
}

function citymapperUrl(site) {
  const params = new URLSearchParams({
    endcoord: `${site.latitude},${site.longitude}`,
    endname: `Curzon ${site.name}`,
    endaddress: site.address,
  });
  return `https://citymapper.com/directions?${params}`;
}

const PIN_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`;

const EXTERNAL_LINK_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>`;

const EYE_OFF_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>`;

const EYE_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>`;

async function main() {
  const statusEl = document.getElementById('status');
  const datePrevBtn = document.getElementById('date-prev');
  const dateNextBtn = document.getElementById('date-next');
  const dateStripEl = document.getElementById('date-strip');
  const timeFilterMode = document.getElementById('time-filter-mode');
  const timeFilterValue = document.getElementById('time-filter-value');
  const cinemaPicker = document.getElementById('cinema-picker');
  const resultsEl = document.getElementById('results');
  const comingSoonEl = document.getElementById('coming-soon');
  const footerEl = document.getElementById('footer-text');

  let data;
  try {
    // A plain relative fetch resolves against the URL's directory, but a
    // trailing-slash-less URL has no directory of its own, so it'd resolve
    // one level up instead — GitHub Pages redirects to add the slash, but
    // not every static host does.
    const basePath = location.pathname.endsWith('/') ? location.pathname : `${location.pathname}/`;
    const res = await fetch(`${basePath}data.json`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    statusEl.textContent = `Couldn't load showtimes data (${err.message}). Try refreshing.`;
    statusEl.classList.add('error');
    return;
  }

  const todayStr = data.days[0];

  let selectedDateIndex = 0;

  // Cinema picker, restoring favourites (default: all selected on first visit)
  const savedFavourites = loadFavourites();
  const favouriteIds = new Set(
    savedFavourites ? savedFavourites.filter((id) => data.sites.some((s) => s.id === id)) : data.sites.map((s) => s.id)
  );

  const hiddenFilmIds = new Set(loadHiddenFilms());

  const timeFilter = loadTimeFilter() || { mode: 'any', time: '18:00' };
  timeFilterMode.value = timeFilter.mode;
  timeFilterValue.value = timeFilter.time;
  timeFilterValue.disabled = timeFilter.mode === 'any';

  timeFilterMode.addEventListener('change', () => {
    timeFilter.mode = timeFilterMode.value;
    timeFilterValue.disabled = timeFilter.mode === 'any';
    saveTimeFilter(timeFilter);
    render();
  });
  timeFilterValue.addEventListener('change', () => {
    timeFilter.time = timeFilterValue.value;
    saveTimeFilter(timeFilter);
    render();
  });

  function renderCinemaPicker() {
    cinemaPicker.innerHTML = '';
    for (const site of data.sites) {
      const label = document.createElement('label');
      label.className = 'cinema-toggle' + (favouriteIds.has(site.id) ? ' active' : '');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = favouriteIds.has(site.id);
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) favouriteIds.add(site.id);
        else favouriteIds.delete(site.id);
        saveFavourites([...favouriteIds]);
        label.classList.toggle('active', checkbox.checked);
        render();
      });
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(site.name));
      cinemaPicker.appendChild(label);
    }
  }

  function renderDateStrip() {
    dateStripEl.innerHTML = '';
    data.days.forEach((day, i) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'date-chip';
      chip.textContent = formatDateChipLabel(day, todayStr);
      chip.addEventListener('click', () => {
        selectedDateIndex = i;
        updateDateNav();
        render();
      });
      dateStripEl.appendChild(chip);
    });
    updateDateNav();
  }

  function updateDateNav() {
    [...dateStripEl.children].forEach((chip, i) => chip.classList.toggle('active', i === selectedDateIndex));
    datePrevBtn.disabled = selectedDateIndex === 0;
    dateNextBtn.disabled = selectedDateIndex === data.days.length - 1;
    const activeChip = dateStripEl.children[selectedDateIndex];
    if (activeChip) activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  datePrevBtn.addEventListener('click', () => {
    if (selectedDateIndex > 0) {
      selectedDateIndex--;
      updateDateNav();
      render();
    }
  });
  dateNextBtn.addEventListener('click', () => {
    if (selectedDateIndex < data.days.length - 1) {
      selectedDateIndex++;
      updateDateNav();
      render();
    }
  });

  function filmIdsShowingOnDate(date) {
    const dayData = data.showtimesByDate[date] || {};
    const ids = new Set();
    for (const site of data.sites) {
      if (!favouriteIds.has(site.id)) continue;
      for (const st of dayData[site.id] || []) ids.add(st.filmId);
    }
    return ids;
  }

  // "New to the cinema" — a film only counts as recently added if our own
  // scrape history first saw it within the last week. This is a definitive
  // signal (persisted in data.films[].firstSeen across scraper runs), not a
  // guess: it doesn't depend on the film's real-world release date, so
  // repertory/classic re-releases count as "new" the moment they're newly
  // programmed, same as an actual new film.
  const NEW_WITHIN_DAYS = 7;

  function isRecentlyAdded(film) {
    if (!film || !film.firstSeen) return false;
    const diffMs = new Date(`${todayStr}T00:00:00Z`) - new Date(`${film.firstSeen}T00:00:00Z`);
    return diffMs >= 0 && diffMs <= NEW_WITHIN_DAYS * 86400000;
  }

  // Films newly added to the schedule with a showing at some point in the
  // next 7 days but not today — easy to miss one-off/repertory screenings if
  // you only ever check today's date.
  function computeComingThisWeek() {
    const weekDays = data.days.slice(0, 7);
    if (weekDays.length <= 1) return [];
    const todayFilmIds = filmIdsShowingOnDate(weekDays[0]);

    const comingMap = new Map();
    for (const day of weekDays.slice(1)) {
      for (const filmId of filmIdsShowingOnDate(day)) {
        if (hiddenFilmIds.has(filmId) || todayFilmIds.has(filmId) || comingMap.has(filmId)) continue;
        if (!isRecentlyAdded(data.films[filmId])) continue;
        comingMap.set(filmId, day);
      }
    }
    return [...comingMap.entries()].sort((a, b) => a[1].localeCompare(b[1]));
  }

  function renderComingSoon() {
    comingSoonEl.innerHTML = '';
    const items = computeComingThisWeek();
    if (items.length === 0) return;

    const details = document.createElement('details');
    details.className = 'coming-soon-details';
    details.open = loadComingSoonOpen();
    details.addEventListener('toggle', () => saveComingSoonOpen(details.open));

    const summary = document.createElement('summary');
    summary.textContent = `Coming up this week (${items.length})`;
    details.appendChild(summary);

    const list = document.createElement('div');
    list.className = 'coming-soon-list';
    for (const [filmId, day] of items) {
      const film = data.films[filmId] || { title: filmId };
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'coming-soon-chip';

      const titleSpan = document.createElement('span');
      titleSpan.textContent = film.title;
      chip.appendChild(titleSpan);

      const dateSpan = document.createElement('span');
      dateSpan.className = 'coming-soon-date';
      dateSpan.textContent = formatDateChipLabel(day, todayStr);
      chip.appendChild(dateSpan);

      chip.addEventListener('click', () => {
        selectedDateIndex = data.days.indexOf(day);
        updateDateNav();
        render();
      });
      list.appendChild(chip);
    }
    details.appendChild(list);
    comingSoonEl.appendChild(details);
  }

  function render() {
    renderComingSoon();
    const date = data.days[selectedDateIndex];
    const dayData = data.showtimesByDate[date] || {};
    resultsEl.innerHTML = '';
    statusEl.classList.remove('error');

    if (favouriteIds.size === 0) {
      statusEl.textContent = 'Pick at least one cinema above.';
      return;
    }

    const selectedSites = data.sites.filter((s) => favouriteIds.has(s.id));
    const siteById = new Map(selectedSites.map((s) => [s.id, s]));

    // filmId -> siteId -> showtimes[]
    const byFilm = new Map();
    for (const site of selectedSites) {
      const showtimes = dayData[site.id] || [];
      for (const st of showtimes) {
        if (!matchesTimeFilter(st.startsAt, timeFilter)) continue;
        if (!byFilm.has(st.filmId)) byFilm.set(st.filmId, new Map());
        const bySite = byFilm.get(st.filmId);
        if (!bySite.has(site.id)) bySite.set(site.id, []);
        bySite.get(site.id).push(st);
      }
    }

    if (byFilm.size === 0) {
      const filterNote = timeFilter.mode !== 'any' && timeFilter.time ? ` ${timeFilter.mode} ${timeFilter.time}` : '';
      statusEl.textContent = `Nothing found for your chosen cinemas${filterNote} on this date.`;
      return;
    }
    statusEl.textContent = '';

    // Films ordered by their earliest showtime across the selected cinemas.
    const filmsSorted = [...byFilm.entries()].sort((a, b) => {
      const earliest = (bySite) => Math.min(...[...bySite.values()].flat().map((t) => Date.parse(t.startsAt)));
      return earliest(a[1]) - earliest(b[1]);
    });

    const visibleFilms = filmsSorted.filter(([filmId]) => !hiddenFilmIds.has(filmId));
    const hiddenFilms = filmsSorted.filter(([filmId]) => hiddenFilmIds.has(filmId));

    if (visibleFilms.length === 0) {
      statusEl.textContent = 'Everything on today is hidden — see the hidden films list below, or try another date.';
    }

    for (const [filmId, bySite] of visibleFilms) {
      const film = data.films[filmId] || { title: filmId, description: '', runtimeMinutes: null };
      const section = document.createElement('section');
      section.className = 'film';

      const h2 = document.createElement('h2');
      const titleSpan = document.createElement('span');
      titleSpan.className = 'film-title';
      titleSpan.textContent = film.title;
      h2.appendChild(titleSpan);

      const hideBtn = document.createElement('button');
      hideBtn.type = 'button';
      hideBtn.className = 'icon-btn';
      hideBtn.title = 'Hide this film';
      hideBtn.setAttribute('aria-label', `Hide ${film.title}`);
      hideBtn.innerHTML = EYE_OFF_ICON_SVG;
      hideBtn.addEventListener('click', () => {
        hiddenFilmIds.add(filmId);
        saveHiddenFilms([...hiddenFilmIds]);
        render();
      });
      h2.appendChild(hideBtn);
      section.appendChild(h2);

      if (film.leavingSoon) {
        const badge = document.createElement('span');
        badge.className = 'leaving-soon-badge';
        badge.textContent = 'Leaving soon';
        badge.title = 'Screenings for this film have stopped being added further out — it may be ending its run soon';
        section.appendChild(badge);
      } else if (film.oneOffScreening) {
        const badge = document.createElement('span');
        badge.className = 'one-off-badge';
        badge.textContent = 'One-off screening';
        badge.title = 'This film has only ever had a single scheduled date — likely a special/anniversary screening, not an ongoing run';
        section.appendChild(badge);
      }

      const meta = document.createElement('div');
      meta.className = 'film-meta';

      const metaLeft = document.createElement('div');
      metaLeft.className = 'film-meta-left';

      // Every segment (runtime, year, RT scores) is its own flex item, all
      // separated by identical dots, so the spacing around each dot matches.
      function appendMetaSegment(el) {
        if (metaLeft.childElementCount > 0) {
          const sep = document.createElement('span');
          sep.className = 'meta-separator';
          sep.textContent = '·';
          metaLeft.appendChild(sep);
        }
        metaLeft.appendChild(el);
      }

      if (film.ageRating) {
        const rating = document.createElement('span');
        rating.className = 'age-rating';
        rating.dataset.rating = film.ageRating;
        rating.textContent = film.ageRating;
        rating.title = 'BBFC age rating';
        appendMetaSegment(rating);
      }

      const runtimeText = formatRuntime(film.runtimeMinutes);
      if (runtimeText) {
        const runtime = document.createElement('span');
        runtime.className = 'runtime';
        runtime.textContent = runtimeText;
        appendMetaSegment(runtime);
      }

      if (film.releaseYear) {
        const year = document.createElement('span');
        year.className = 'runtime';
        year.textContent = film.releaseYear;
        appendMetaSegment(year);
      }

      if (film.rottenTomatoes) {
        const rt = film.rottenTomatoes;
        const parts = [];
        if (rt.criticsScore != null) parts.push(`🍅 ${rt.criticsScore}%`);
        if (rt.audienceScore != null) parts.push(`🍿 ${rt.audienceScore}%`);

        const rtScore = document.createElement('a');
        rtScore.className = 'rt-score';
        rtScore.href = rt.url;
        rtScore.target = '_blank';
        rtScore.rel = 'noopener';
        rtScore.textContent = parts.length ? parts.join(' ') : 'View on Rotten Tomatoes';
        rtScore.title = 'View on Rotten Tomatoes';
        appendMetaSegment(rtScore);
      }

      meta.appendChild(metaLeft);

      const curzonLink = document.createElement('a');
      curzonLink.className = 'curzon-link';
      curzonLink.href = filmUrl(filmId);
      curzonLink.target = '_blank';
      curzonLink.rel = 'noopener';
      curzonLink.title = 'View on curzon.com';
      curzonLink.setAttribute('aria-label', `View ${film.title} on curzon.com`);
      curzonLink.innerHTML = EXTERNAL_LINK_ICON_SVG;
      meta.appendChild(curzonLink);

      section.appendChild(meta);

      if (film.description) {
        const p = document.createElement('p');
        p.className = 'desc';
        p.textContent = film.description;
        section.appendChild(p);
      }

      const sitesSorted = [...bySite.entries()].sort((a, b) =>
        siteById.get(a[0]).name.localeCompare(siteById.get(b[0]).name)
      );

      for (const [siteId, times] of sitesSorted) {
        times.sort((a, b) => a.startsAt.localeCompare(b.startsAt));

        const group = document.createElement('div');
        group.className = 'cinema-group';

        const site = siteById.get(siteId);
        const h3 = document.createElement('h3');
        h3.appendChild(document.createTextNode(site.name));
        const mapLink = document.createElement('a');
        mapLink.className = 'citymapper-link';
        mapLink.href = citymapperUrl(site);
        mapLink.target = '_blank';
        mapLink.rel = 'noopener';
        mapLink.title = 'Directions via Citymapper';
        mapLink.setAttribute('aria-label', `Directions to ${site.name} via Citymapper`);
        mapLink.innerHTML = PIN_ICON_SVG;
        h3.appendChild(mapLink);
        group.appendChild(h3);

        const timesDiv = document.createElement('div');
        timesDiv.className = 'times';
        for (const t of times) {
          if (t.isSoldOut) {
            const chip = document.createElement('span');
            chip.className = 'time-chip sold-out';
            chip.textContent = formatTimeRange(t.startsAt, t.endsAt);
            chip.title = 'Sold out';
            chip.setAttribute('aria-disabled', 'true');
            timesDiv.appendChild(chip);
            continue;
          }
          const chip = document.createElement('a');
          chip.className = 'time-chip';
          chip.textContent = formatTimeRange(t.startsAt, t.endsAt);
          chip.href = bookingUrl(t.id);
          chip.target = '_blank';
          chip.rel = 'noopener';
          timesDiv.appendChild(chip);
        }
        group.appendChild(timesDiv);
        section.appendChild(group);
      }

      resultsEl.appendChild(section);
    }

    if (hiddenFilms.length > 0) {
      const details = document.createElement('details');
      details.className = 'hidden-section';

      const summary = document.createElement('summary');
      summary.textContent = `Hidden films (${hiddenFilms.length})`;
      details.appendChild(summary);

      const list = document.createElement('div');
      list.className = 'hidden-list';
      for (const [filmId] of hiddenFilms) {
        const film = data.films[filmId] || { title: filmId };
        const item = document.createElement('div');
        item.className = 'hidden-list-item';

        const title = document.createElement('span');
        title.textContent = film.title;
        item.appendChild(title);

        const unhideBtn = document.createElement('button');
        unhideBtn.type = 'button';
        unhideBtn.className = 'unhide-btn';
        unhideBtn.innerHTML = `${EYE_ICON_SVG}<span>Unhide</span>`;
        unhideBtn.addEventListener('click', () => {
          hiddenFilmIds.delete(filmId);
          saveHiddenFilms([...hiddenFilmIds]);
          render();
        });
        item.appendChild(unhideBtn);

        list.appendChild(item);
      }
      details.appendChild(list);
      resultsEl.appendChild(details);
    }
  }

  renderCinemaPicker();
  renderDateStrip();
  render();

  const generated = new Date(data.generatedAt);
  footerEl.textContent = `Listings last refreshed ${generated.toLocaleString('en-GB')}. Not affiliated with Curzon.`;
}

main();
</script>
</body>
</html>
